name: web tests

# The browser build's share of the shared behaviour spec.
#
# Separate from tests.yml because it needs a different runtime and no macOS:
# everything tested here is pure logic -- names, sizes, file kinds, the PDF
# writer's byte layout -- which is exactly the part that has to agree with the
# Python build. The canvas and WebAssembly half cannot run without a browser
# and is checked by hand in one.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/web-tests.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/web-tests.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version still supported, and the current one. Node's own
        # test runner is used, so there is nothing to install.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      # Python is here on purpose: web/tests/pdfwrite.test.mjs hands each case
      # to the original Python writer and demands identical bytes. Without it
      # that test skips, and the port stops being checked against anything.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run the tests
        run: node --test web/tests/*.test.mjs

      - name: The vendored decoder must be the real one, unmodified
        run: |
          # A tampered or truncated decoder is the one dependency that could
          # quietly betray the privacy promise, so its hash is pinned.
          # The same goes for pdf.js, which reads every PDF dropped on the page.
          sha256sum -c - <<'SUMS'
          095194187be00d3e36335b8ad7f5552d70655e5e2159486d7d36cd4daa47bba9  web/vendor/libheif/libheif-bundle.mjs
          3a88402882cfa3e7e72c2c9b5149f52f0f88baf1c5b62aa11a41abdbc2072440  web/vendor/pdfjs/pdf.min.mjs
          1e64c8240e54735ec5913b37acd5134747799cb8c6bb3777c70adbc01232d2aa  web/vendor/pdfjs/pdf.worker.min.mjs
          SUMS

      - name: Every worker must start under the page's policy
        run: |
          # A worker loaded from its own URL does not inherit the page's
          # <meta> CSP, so it could reach the network even though the page
          # cannot. worker.js starts workers through a blob: wrapper that does
          # inherit it; nothing else may call new Worker or SharedWorker.
          if grep -rnE 'new (Shared)?Worker\(' web/js web/index.html | grep -v '^web/js/worker.js:'; then
            echo "::error::start workers with sandboxedWorker() from web/js/worker.js"
            exit 1
          fi
          echo "ok"

      - name: The deploy's cache stamp still finds what it must
        run: |
          cp -R web "$RUNNER_TEMP/site"
          python3 .github/scripts/stamp_version.py "$RUNNER_TEMP/site" test123
          if grep -rnE "[\"']\.{1,2}/[^\"'?]+\.m?js[\"']" "$RUNNER_TEMP/site/js"; then
            echo "::error::a script reference escaped the version stamp"
            exit 1
          fi

      - name: Nothing in web/ may reach off-origin
        run: |
          # The same check the deploy runs, on every change rather than only at
          # publish time -- a CDN reference should fail in review, not later.
          if grep -rnE 'src=["'"'"']https?://' web/ --include='*.html' --include='*.js'; then
            echo "::error::web/ loads a remote asset; vendor it instead (see web/vendor/README.md)"
            exit 1
          fi
          if grep -rnE '<link[^>]+href=["'"'"']https?://' web/ --include='*.html'; then
            echo "::error::web/ links a remote stylesheet or resource; vendor it instead"
            exit 1
          fi
          grep -q "connect-src 'none'" web/index.html || {
            echo "::error::web/index.html no longer sets connect-src 'none'"; exit 1; }
          echo "ok"
