name: tests

on:
  # Path filters keep the macOS runner out of changes that cannot affect it --
  # a tweak to web/ or the README should not spend macOS minutes. shared/ is
  # included because the spec there drives the Python tests.
  # (listed twice rather than using a YAML anchor: GitHub Actions does not
  # support anchors in workflow files)
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'shared/**'
      - 'run.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'shared/**'
      - 'run.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Convertly is a macOS tool: it uses `sips` and Quick Look, so the tests
    # have to run on a macOS runner to exercise anything real.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately does not use tomllib: that only exists from Python 3.11,
      # and this project supports 3.10.
      - name: Confirm there are no dependencies to install
        run: python3 tests/check_no_dependencies.py

      - name: Run tests with the coverage floor
        run: python3 tests/coverage_report.py --min 85

      - name: Check the app starts and serves the UI
        run: |
          python3 run.py --no-browser --port 8791 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8791/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8791/health
          curl -fsS http://127.0.0.1:8791/ | grep -q "<title>Convertly</title>"
          echo "the app starts and serves its UI"
          kill %1
