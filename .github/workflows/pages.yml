name: deploy web

# Publishes https://techbydisha.github.io/convertly/ on every change to web/.
#
# The site is served from web/, not /docs -- /docs holds this project's
# documentation, and "deploy from a branch" only offers the repository root or
# /docs. Deploying through Actions is what allows any directory.
#
# No custom domain. Setting one in Settings -> Pages only works for a domain
# you own and can add a DNS record to; pointing it at a name someone else owns
# leaves the site unreachable and unable to get a certificate.
#
# If a deploy fails, start a NEW run -- do not use "Re-run failed jobs". A
# re-run uploads a second artifact called github-pages into the same run, and
# deploy-pages then refuses with "Multiple artifacts named github-pages were
# unexpectedly found". The Actions tab's "Run workflow" button is the way out.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, not one, and this is the reason: uploading the artifact and asking
# to deploy it have to happen in separate jobs. The artifact API is eventually
# consistent, and in one job deploy-pages queries it about half a second after
# the upload finishes -- often before it is visible -- and fails with "No
# artifacts named github-pages were found". The job boundary is the wait.
# deploy-pages' own backoff does not cover this; it polls the deployment, not
# the artifact lookup that happens first.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse to publish anything that reaches off-origin
        run: |
          # The whole point of this build is that files stay on the device.
          # A stray CDN reference would break that, so fail the deploy rather
          # than ship it.
          #
          # What counts is what the browser *fetches*, not where the reader can
          # click: src= on any element, and href= on <link>, pull a remote file
          # in. A plain <a href> is a link the reader chooses to follow, and
          # the page carries referrer="no-referrer" so following one says
          # nothing about where they came from.
          if grep -rnE 'src=["'"'"']https?://' web/ --include='*.html' --include='*.js'; then
            echo "::error::web/ loads a remote asset; vendor it instead (see web/vendor/README.md)"
            exit 1
          fi
          if grep -rnE '<link[^>]+href=["'"'"']https?://' web/ --include='*.html'; then
            echo "::error::web/ links a remote stylesheet or resource; vendor it instead"
            exit 1
          fi
          if ! grep -q "Content-Security-Policy" web/index.html; then
            echo "::error::web/index.html has no Content Security Policy"
            exit 1
          fi
          # connect-src 'none' is the guarantee itself, not a nicety: without it
          # the page merely promises not to upload anything.
          if ! grep -q "connect-src 'none'" web/index.html; then
            echo "::error::web/index.html no longer sets connect-src 'none'"
            exit 1
          fi
          echo "no remote assets, CSP present, connect-src 'none' intact"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
